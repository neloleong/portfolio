<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>我的作品集</title>

  <style>
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;
      background:#0f1220;
      color:#eaeaf0;
      line-height:1.8;
    }
    .wrap{
      max-width:900px;
      margin:auto;
      padding:60px 24px;
    }
    h1{ font-size:42px; margin-bottom:10px; }
    h2{ margin-top:60px; font-size:26px; }
    p{ color:#bfc3ff; }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:24px;
      margin-top:24px;
    }
    .card{
      background:#181c3a;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,.4);
    }
    .card img{
      width:100%;
      display:block;
    }
    .card .txt{
      padding:16px;
    }
    footer{
      margin-top:80px;
      font-size:13px;
      color:#8b8fff;
    }
  </style>
</head>

  <nav style="display:flex;gap:14px;align-items:center;padding:16px 0;">

        <img src="https://via.placeholder.com/800x500?text=Image+1">

          <p>這是第三個作品的簡短說明。</p>
